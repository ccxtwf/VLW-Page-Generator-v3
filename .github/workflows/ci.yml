name: Continuous Integration

on:
  push:
    branches:
      - main
      - development
    paths-ignore:
      - ".agents/**"
      - "skills-lock.json"
      - "**/*.md"
  pull_request:
    branches:
      - main
      - development

  # Allow manual deployments from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite Plus app
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - run: vp install
      - run: vp check
      - run: vp test