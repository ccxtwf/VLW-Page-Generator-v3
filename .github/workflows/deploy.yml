name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # deploy on changes to source code only
    # do not rebuild/redeploy on changes to public assets (including synths.db)
    # do not rebuild/redeploy on changes to package.json & package-lock.json (explicitly must require manual deployment)
    paths:
      - "src/**"

  # Allow manual deployments from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Vite Plus app
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Set environment variables
        run: |
          echo "VITE_REFER_FROM_ORIGIN=${{ github.repository_owner }}.github.io" >> $GITHUB_ENV

          echo "ASSETS_PATH=https://cdn.jsdelivr.net/gh/${{ github.repository }}@data/" >> $GITHUB_ENV

          echo "VITE_GITHUB_REPO_LINK=${{ github.server_url }}/${{ github.repository }}" >> $GITHUB_ENV
          echo "VITE_GITLAB_REPO_LINK=${{ vars.GITLAB_URL }}" >> $GITHUB_ENV

          echo "VITE_BUILD_CODE=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "VITE_BUILD_DATE=$(date -Iseconds)" >> $GITHUB_ENV

          cat $GITHUB_ENV

      - run: |
          vp install
          git apply --ignore-space-change --ignore-whitespace --directory=node_modules/ patches/*.patch

      - run: vp build --base "${{ github.event.repository.name }}"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Determine semantic version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          # The prefix to use to identify tags
          tag_prefix: "v"
          # A string which, if present in a git commit, indicates that a change represents a
          # major (breaking) change, supports regular expressions wrapped with '/'
          major_pattern: "/!:|BREAKING CHANGE:/"
          # Same as above except indicating a minor change, supports regular expressions wrapped with '/'
          minor_pattern: "/feat:(\\(.+\\))?:/"

          # bump semver only on changes to src/
          change_path: "src"
          bump_each_commit: false

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version_tag }}"
          git push origin "${{ steps.version.outputs.version_tag }}"